name: CI

# Responsibility: don't let a broken change land. Builds, tests, and
# publishes every module to the local Maven repository (never to Maven
# Central) so publication wiring is exercised without needing release
# secrets. Runs on every push and every PR into master.
on:
  push:
    branches:
      - master
      - claude
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 36 and build-tools
        # ubuntu-latest ships older SDK versions. compileSdk 36 and
        # build-tools 36.0.0 must be installed explicitly or the Android
        # Gradle Plugin will fail at configuration time with "SDK not found".
        run: |
          ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify repository (build + test + publishToMavenLocal + artifact checks)
        # spatialRelease is intentionally left unset here: signAllPublications()
        # never runs in CI, so no signing key is required for this workflow.
        # --no-configuration-cache: avoids non-deterministic CC failures from
        # tasks that capture subproject references during configuration.
        env:
          GRADLE_OPTS: "-Dfile.encoding=UTF-8 -Xmx4g -Xms512m"
        run: |
          ./gradlew --no-daemon --no-configuration-cache verifyRepository

